version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sabemi-webhooks-db
    environment:
      POSTGRES_DB: sabemi_webhooks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sabemi_webhooks_data:/var/lib/postgresql/data

volumes:
  sabemi_webhooks_data:
